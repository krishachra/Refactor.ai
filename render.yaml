services:
  - type: web
    name: refactor-ai-backend
    env: python
    buildCommand: "pip install pydantic"
    startCommand: "python backend/main.py $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: nebius/nvidia/Nemotron-3_5-Lightning
      - key: NEBIUS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

